<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Test — theme toggle preserves scroll (no jump to top)</title>
<!--
  Regression test for: toggling the theme must NOT bounce the scroll position to
  the top of the page. theme.js does a display:none repaint (an iOS Safari fix)
  and restores window.scrollTo(sx, sy); on a page with `scroll-behavior: smooth`
  that restore used to ANIMATE from the collapsed top — a visible jump-to-top.

  This is a no-tooling test: open it in any browser (or via the static server),
  it drives the REAL theme.js toggle button and reports PASS/FAIL on the page and
  to the console. It reproduces the bug condition by setting scroll-behavior:smooth
  and a tall page, scrolling down, clicking the toggle, then sampling the scroll
  position across animation frames — asserting it never returns near 0.
-->
<style>
  /* The exact condition that triggered the bug on the docs page. */
  html { scroll-behavior: smooth; }
  body { margin: 0; font: 15px -apple-system, sans-serif; }
  .filler { height: 4000px; padding: 80px 24px; }
  #result { position: fixed; left: 12px; bottom: 12px; z-index: 9999;
    padding: 10px 14px; border-radius: 10px; font-weight: 700;
    background: #333; color: #fff; }
  .pass { background: #1a7f37 !important; }
  .fail { background: #cf222e !important; }
</style>
</head>
<body>
  <footer></footer> <!-- theme.js appends its footer brand here -->
  <div class="filler">Scroll target — this page is intentionally tall.</div>
  <div id="result">running…</div>

<script>
// Load the REAL theme.js, cache-busted so the test always exercises the current
// file (a stale cached copy would test the wrong code), then run the assertions.
(function () {
  var s = document.createElement("script");
  s.src = "../theme.js?nocache=" + Date.now();
  s.onload = runThemeScrollTest;
  s.onerror = function () {
    var out = document.getElementById("result");
    out.textContent = "FAIL — theme.js failed to load";
    out.className = "fail";
    window.__themeScrollTestResult = { ok: false, msg: "theme.js failed to load" };
  };
  document.head.appendChild(s);
})();

function runThemeScrollTest() {
  var out = document.getElementById("result");
  function done(ok, msg) {
    out.textContent = (ok ? "PASS" : "FAIL") + " — " + msg;
    out.className = ok ? "pass" : "fail";
    (ok ? console.log : console.error)("[theme-scroll] " + (ok ? "PASS" : "FAIL") + " — " + msg);
    window.__themeScrollTestResult = { ok: ok, msg: msg }; // for headless drivers
  }

  var toggle = document.querySelector(".theme-toggle");
  if (!toggle) { done(false, "theme toggle button not found (theme.js didn't load?)"); return; }

  var target = 1500;
  var root = document.documentElement;
  // Setup positioning must be INSTANT — temporarily disable the smooth rule
  // (the `behavior:"instant"` option isn't honoured everywhere), then restore it
  // so smooth is active at TOGGLE time, which is what reproduces the bug.
  var prevSB = root.style.scrollBehavior;
  root.style.scrollBehavior = "auto";
  window.scrollTo(0, target);
  root.style.scrollBehavior = prevSB;

  // Let things settle, then toggle and watch for a bounce-to-top.
  setTimeout(function () {
    var start = window.scrollY;
    if (Math.abs(start - target) > 5) { done(false, "could not position scroll (got " + start + ")"); return; }

    var minSeen = start;
    toggle.click();

    // Sample with timers (not rAF) so it still runs when the tab is backgrounded
    // — headless/preview tabs throttle requestAnimationFrame.
    var frames = 0;
    (function sample() {
      minSeen = Math.min(minSeen, window.scrollY);
      if (++frames < 40) { setTimeout(sample, 16); return; }
      // After settling: scroll must have stayed put (never dipped toward the top)
      // and must end where it started.
      var bounced = minSeen < start - 50;     // dipped toward the top during toggle
      var ended   = Math.abs(window.scrollY - start) <= 5;
      if (bounced)      done(false, "scroll bounced toward top during toggle (min=" + Math.round(minSeen) + ", start=" + start + ")");
      else if (!ended)  done(false, "scroll not restored (end=" + Math.round(window.scrollY) + ", start=" + start + ")");
      else              done(true,  "scroll held at " + start + " through theme toggle (min=" + Math.round(minSeen) + ")");
    })();
  }, 150);
}
</script>
</body>
</html>
